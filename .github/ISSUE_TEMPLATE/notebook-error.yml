name: Notebook không chạy
description: Notebook báo lỗi khi chạy, thường do phiên bản Qiskit mới đổi API
title: "[notebook] PP_BB: "
labels: [notebook]
body:
  - type: input
    id: notebook
    attributes:
      label: Notebook
      placeholder: chapters/02_quantum_computing/02_03_single_qb_sys.ipynb
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Lỗi
      description: Dán cell gây lỗi và toàn bộ traceback
      render: text
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Phiên bản
      description: Kết quả của `pip list | grep -iE "qiskit|numpy|matplotlib"` và `python --version`
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Hệ điều hành
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
